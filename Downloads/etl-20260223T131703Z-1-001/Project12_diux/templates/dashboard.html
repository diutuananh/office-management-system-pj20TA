<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style.css') }}">

</head>

<body>

    <div class="sidebar">

        <a href="/">Dashboard</a>

        <a href="/equipment">Equipment</a>

        <a href="/maintenance">Maintenance</a>

        <a href="/purchases">Purchases</a>

    </div>

    <div class="main">

        <div class="topbar">
            OFFICE SYSTEM MANAGEMENT
        </div>

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">

                <h3>Total Equipment</h3>

                <p>{{ total }}</p>

            </div>

            <div class="card">

                <h3>Available</h3>

                <p>{{ available }}</p>

            </div>

            <div class="card">

                <h3>Maintenance</h3>

                <p>{{ maintenance }}</p>

            </div>

        </div>

        <div class="chart-container">

            <canvas id="myChart"></canvas>

        </div>

    </div>

    <script src=
    "https://cdn.jsdelivr.net/npm/chart.js">

    </script>

    <script>

        const ctx =
        document.getElementById('myChart');

        new Chart(ctx, {

            type: 'pie',

            data: {

                labels: [

                    'Available',

                    'Maintenance'

                ],

                datasets: [{

                    data: [

                        "{{ available }}",

                        "{{ maintenance }}"

                    ],

                    backgroundColor: [

                        '#2ecc71',

                        '#e74c3c'

                    ],

                    borderWidth: 2

                }]
            }

        });

    </script>

</body>
</html>
