<!DOCTYPE html>
<html>

<head>

    <title>Add Equipment</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="page-center">

    <div class="form-container">

        <div class="topbar">
            ADD NEW EQUIPMENT
        </div>

        <form method="POST" class="form-box">

            <input
                type="text"
                name="name"
                placeholder="Equipment Name"
                required>

            <!-- TYPE AUTOCOMPLETE -->
            <input
                type="text"
                name="type"
                placeholder="Type (e.g Laptop, Printer...)"
                list="typeList"
                required>

            <datalist id="typeList">
                {% for t in types %}
                    <option value="{{ t }}">
                {% endfor %}
            </datalist>

            <!-- UNIT AUTOCOMPLETE (FIX MỚI) -->
            <input
                type="text"
                name="unit"
                placeholder="Unit (e.g Piece, Set...)"
                list="unitList"
                required>

            <datalist id="unitList">
                {% for u in units %}
                    <option value="{{ u }}">
                {% endfor %}
            </datalist>

            <select name="status">

                <option value="Available">Available</option>
                <option value="Maintenance">Maintenance</option>

            </select>

            <select name="department">

                {% for d in departments %}
                <option value="{{ d.DepartmentID }}">
                    {{ d.DepartmentName }}
                </option>
                {% endfor %}

            </select>

            <button type="submit">
                Add Equipment
            </button>

        </form>

    </div>

</div>

</body>
</html>
