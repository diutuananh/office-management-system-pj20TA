<!DOCTYPE html>
<html>

<head>
    <title>Add Equipment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="page-center">

    <div class="form-container">

        <div class="topbar">
            ADD NEW EQUIPMENT
        </div>

        <form method="POST" class="form-box">

            <input
                type="text"
                name="name"
                placeholder="Equipment Name"
                required>

            <input
                type="text"
                name="type"
                placeholder="Type (e.g Laptop, Printer...)"
                list="typeList"
                required>

            <datalist id="typeList">
                {% for t in types %}
                    <option value="{{ t }}">
                {% endfor %}
            </datalist>

            <input
                type="text"
                name="unit"
                placeholder="Unit (e.g Piece, Set...)"
                list="unitList"
                required>

            <datalist id="unitList">
                {% for u in units %}
                    <option value="{{ u }}">
                {% endfor %}
            </datalist>

            <select name="status">
                <option value="Available">Available</option>
                <option value="In Use">In Use</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Broken">Broken</option>
            </select>

            <select name="department" required>
                <option value="" disabled selected>Select Department</option>
                {% for d in departments %}
                <option value="{{ d.DepartmentID }}">
                    {{ d.DepartmentName }}
                </option>
                {% endfor %}
            </select>

            <select name="employee">
                <option value="">-- Assign to Employee (Optional) --</option>
                {% for emp in employees %}
                <option value="{{ emp.EmployeeID }}">
                    {{ emp.EmployeeName }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">
                Add Equipment
            </button>

            <div style="text-align: center; margin-top: 10px;">
                <a href="/equipment" style="text-decoration: none; color: #666; font-size: 14px;">Back to List</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
