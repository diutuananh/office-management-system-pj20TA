<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Office System Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f8fb;
        }
        
        .login-container {
            animation: fadeIn 0.6s ease;
        }

        .form-box {
            width: 350px;
            border-top: 5px solid #5dade2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-title {
            font-size: 24px;
            color: #3498db;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 90% !important;
            text-align: center;
            margin-bottom: 15px !important;
        }

        button {
            width: 90% !important;
            margin-top: 10px;
        }

        p {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="form-box">
        <div class="login-title">SYSTEM LOGIN</div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input 
                type="text" 
                name="username" 
                placeholder="Username" 
                required>

            <input 
                type="password" 
                name="password" 
                placeholder="Password" 
                required>

            <button type="submit">Login to System</button>
        </form>
        
        <p>&copy; 2026 Office Management System</p>
    </div>
</div>

</body>
</html>
